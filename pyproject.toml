[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routeguard"
version = "1.2.0"
description = "可核验的骑行路书：断言级证据绑定与三态核验"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "扈宇恒" }]
keywords = ["cycling", "fact-verification", "llm", "gis", "trustworthy-ai"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
routeguard = "routeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# 示例数据随包分发，否则 pip 安装后 `audit`/`selftest` 找不到文件
[tool.setuptools.package-data]
routeguard = [
    "data/sample/*.gpx",
    "data/sample/*.md",
    "data/fixtures/*.json",
    "skills/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
